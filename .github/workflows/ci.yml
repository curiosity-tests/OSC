# Continuous integration for CNMAT/OSC.
#
# This replaces the Travis configuration proposed in PR #86 (peternewman,
# 2018). The intent there was right and is honoured here; the mechanism is
# not, because travis-ci.org/.com no longer builds open-source repositories,
# the Trusty image and the container/sudo/group keys that config uses were
# retired, and the cpplint URL it downloads returns 404.
name: CI
run-name: "CI ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""


permissions:
  contents: read
  id-token: write
env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  host:
    # The suite that needs no board and no Arduino toolchain: an OSC 1.0
    # decoder written from the spec, randomised round-trips, named
    # regressions, pattern semantics, DoS bounds and 150000 rounds of
    # malformed input, all under AddressSanitizer and UBSan.
    name: host suite (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
    - uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        lfs: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: make asan
      run: make -C test/host asan
    - name: python firmwares (codec cross-check vs oscprobe and the oracle)
      run: python3 extras/python/test_host.py
    - name: contractprobe against a simulated board (no hardware)
      run: python3 test/hardware/test_contractprobe.py

    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
  webserial:
    # The Web Serial pages are generated from a template; this fails if a
    # generated file has been hand-edited out of sync with it.
    name: web serial generator
    runs-on: ubuntu-latest
    steps:
    - uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        lfs: false
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: check drift and run the codec tests
      run: make -C extras/webserial all

    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
  examples:
    # One job per core so a failure names the platform. Each core builds
    # only the examples it can: the ESP8266, WiFi, Ethernet and
    # board-specific sketches need libraries or hardware a given core does
    # not have.
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: arduino:avr:uno
          fqbn: arduino:avr:uno
          core: arduino:avr
          sketches: SerialSendMessage SerialSendBundle SerialReceive SerialEcho SerialCallResponse PatternMatching SerialOscuinowithBundles SerialOscuinowithMessages
        - name: arduino:avr:leonardo
          fqbn: arduino:avr:leonardo
          core: arduino:avr
          sketches: SerialSendMessage SerialReceive SerialEcho SerialSendMessageInfiniteLoop SerialReceiveInfiniteLoop
        - name: arduino:avr:esplora
          fqbn: arduino:avr:esplora
          core: arduino:avr
          libs: Esplora
          sketches: OSCEsplora EsploraOscuino
        - name: arduino:samd
          fqbn: arduino:samd:mkrzero
          core: arduino:samd
          sketches: SerialSendMessage SerialReceive SerialEcho PatternMatching
        - name: esp32:esp32
          fqbn: esp32:esp32:esp32
          core: esp32:esp32
          url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          sketches: SerialSendMessage SerialReceive SerialEcho PatternMatching SerialOscuinowithBundles
        - name: rp2040
          fqbn: rp2040:rp2040:rpipico
          core: rp2040:rp2040
          url: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          sketches: SerialSendMessage SerialReceive SerialEcho PatternMatching
        - name: esp32c6 xiao (serial, wifi, ble)
          fqbn: esp32:esp32:XIAO_ESP32C6
          core: esp32:esp32
          url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libs: '"Adafruit SSD1306" "Adafruit GFX Library" "Adafruit BusIO" "I2C BM8563 RTC"'
          sketches: XiaoC6ExpOscuino XiaoC6ExpWiFi XiaoC6ExpBLE
        - name: esp32c3 eggc3
          fqbn: esp32:esp32:esp32c3:CDCOnBoot=cdc
          core: esp32:esp32
          url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libs: U8g2
          sketches: EggC3Oscuino EggC3WiFi
        - name: silabs mg24 (serial + ble)
          fqbn: SiliconLabs:silabs:xiao_mg24:protocol_stack=ble_silabs
          core: SiliconLabs:silabs
          url: https://siliconlabs.github.io/arduino/package_arduinosilabs_index.json
          sketches: XiaoMG24BLE
        - name: rp2350 fruitjam
          fqbn: rp2040:rp2040:adafruit_fruitjam
          core: rp2040:rp2040
          url: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          libs: '"Adafruit NeoPXL8" "Adafruit GFX Library" "Adafruit BusIO" "Adafruit TLV320 I2S" "Adafruit DVI HSTX"'
          sketches: FruitJamOscuino
    steps:
    - uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        lfs: false
    - uses: arduino/setup-arduino-cli@v1
    - name: install core
      run: |
        if [ -n "${{ matrix.url }}" ]; then
          arduino-cli core update-index --additional-urls "${{ matrix.url }}"
          arduino-cli core install "${{ matrix.core }}" --additional-urls "${{ matrix.url }}"
        else
          arduino-cli core update-index
          arduino-cli core install "${{ matrix.core }}"
        fi
    - name: install any libraries the sketches need
      if: matrix.libs != ''
      run: arduino-cli lib install ${{ matrix.libs }}
    - name: make the library visible to the compiler
      run: |
        mkdir -p "$HOME/Arduino/libraries"
        ln -s "$GITHUB_WORKSPACE" "$HOME/Arduino/libraries/OSC"
    - name: compile examples
      run: |
        rc=0
        for s in ${{ matrix.sketches }}; do
          echo "::group::$s"
          # --build-path per sketch: arduino-cli keys its default build
          # cache on the sketch path alone, so parallel jobs sharing a
          # runner can otherwise stomp each other's objects.
          arduino-cli compile -b "${{ matrix.fqbn }}" \
            --build-path "${RUNNER_TEMP}/build-$s" \
            "examples/$s" || rc=1
          echo "::endgroup::"
        done
        exit $rc
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
